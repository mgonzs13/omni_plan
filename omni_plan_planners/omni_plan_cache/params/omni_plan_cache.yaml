/omni_plan_node:
  ros__parameters:
    planner:
      plugin: "omni_plan_cache/CachePlanner"

      # Sub-planner plugin to wrap
      planner_plugin: "omni_plan_popf/PopfPlanner"

      # Validator plugin to use
      validator_plugin: "omni_plan_val/ValValidator"

      # Sub-planner parameters are declared under the "planner.sub_planner" namespace.
      sub_planner:
        disable_best_first: false
        skip_ehc: false
        standard_ehc: false
        disable_helpful_pruning: false
        disable_compression_safe: false
        disable_tie_breaking_rpg: false
        sort_initial_layer: false
        disable_tie_breaking_search: false
        full_ff_helpful: false
        total_order: false

      # Validator parameters are declared under the "planner.validator" namespace.
      validator:
        tolerance: 0.0
        robustness_n: 0.0
        robustness_p: 0.0
        robustness_m: 0
        robustness_action_p: 0.0
        robustness_pne_n: 0.0
        robustness_metric: "m"
        robustness_distribution: "u"
        vary_event_preconditions: false
        use_graphplan_length: false
        check_derived_predicates: true
        continue_on_precondition_fail: false
        produce_error_report: false
        warn_invariants: false
        use_makespan_metric: false
