/omni_plan_node:
  ros__parameters:
    # Enable publishing state machine data for viewer
    enable_viewer_pub: true
    # If true, the state machine will also cancel execution if any action aborts,
    # which means canceling parallel branches that are still running. If false,
    # allows already running actions to finish even if an abort has occurred
    cancel_on_abort: false
    # If true, the state machine will cancel execution if new goals are added to
    # the PDDL manager during execution, which may indicate that the current plan
    # is no longer valid. If false, new goals will be ignored during execution.
    cancel_on_new_goals: false
    # Number of threads to use for parallel execution (default: number of hardware threads)
    execution_threads: -1

    pddl_manager:
      plugin: "omni_plan_knowledge_base/KbPddlManager"
      # Domain requirements
      domain_requirements:
        - "typing"
        - "negative-preconditions"
        - "durative-actions"

    planner:
      plugin: "omni_plan_lpg/LpgPlanner"
      # Number of solutions to compute
      num_solutions: 1
      # Heuristic function: 1 or 2
      heuristic: 1
      # Maximum number of restarts
      restarts: 50
      # Number of steps in the first run of the local search
      search_steps: 500
      # Noise factor for Walkplan, range [0.0, 1.0]
      noise: 0.1
      # Switch off best-first search
      nobestfirst: false
      # Immediately run best-first search
      onlybestfirst: false
      # Random seed (0 means not set)
      seed: 0
      # Inconsistency selection method
      i_choice: 2
      # Maximum CPU time in seconds (0 means unlimited)
      cputime: 0
      # Take overlapping of actions into account during neighbourhood evaluation
      advanced_time: false

    plan_validator:
      plugin: "omni_plan_val/ValValidator"
      # Tolerance value for validation (float)
      tolerance: 0.0
      # Robustness analysis parameters: n (timestamp tolerance), p (PNE tolerance), m (number of test plans)
      robustness_n: 0.0
      robustness_p: 0.0
      robustness_m: 0
      # Robustness for action timestamps with PNE tolerance p
      robustness_action_p: 0.0
      # Robustness for PNEs with timestamp tolerance n
      robustness_pne_n: 0.0
      # Metric for robustness testing: "m" (maximum), "a" (accumulative), "d" (delay)
      robustness_metric: "m"
      # Distribution for robustness testing: "u" (uniform), "n" (normal), "p" (pseudo-normal)
      robustness_distribution: "u"
      # Vary PNEs for event preconditions
      vary_event_preconditions: false
      # Use graphplan length where no metric specified
      use_graphplan_length: false
      # Check set of derived predicates for stratification
      check_derived_predicates: true
      # Continue executing plan even if an action precondition is unsatisfied
      continue_on_precondition_fail: false
      # Produce error report for the full plan and try to repair it
      produce_error_report: false
      # Warn if invariants with continuous effects cannot be checked
      warn_invariants: false
      # Use makespan as metric for temporal plans
      use_makespan_metric: false

    actions_plugins:
      - "omni_plan_demos/MoveYasminFactoryAction"
      - "omni_plan_demos/ChargeAction"
      - "omni_plan_demos/AskChargeAction"
    move_action:
      increment: 0.05
      abort_outcome: aborted
      cancel_outcome: canceled
      succeed_outcome: succeeded
      enable_viewer_pub: true
    charge_action:
      increment: 0.05
    ask_charge_action:
      increment: 0.05
