/omni_plan_node:
  ros__parameters:
    pddl_manager:
      plugin: "omni_plan_knowledge_base/KbPddlManager"
      # Domain requirements
      domain_requirements:
        - "typing"
        - "negative-preconditions"
        - "durative-actions"

    planner:
      plugin: "omni_plan_optic/OpticPlanner"
      # Don't optimise solution quality (ignores preferences and costs)
      no_optimise: true
      # Abstract out timed initial literals that represent recurrent windows
      abstract_timed_literals: false
      # Optimise solution quality, capping cost at this value (-1 to disable)
      cost_limit: -1.0
      # Disable best-first search; if EHC fails, abort
      disable_best_first: false
      # Skip EHC: go straight to best-first search
      skip_ehc: false
      # Use standard EHC instead of steepest descent
      standard_ehc: false
      # Disable helpful-action pruning
      disable_helpful_pruning: false
      # Disable compression-safe action detection
      disable_compression_safe: false
      # Enable tie-breaking in RPG that favours actions that slot into the partial order earlier
      tie_breaking_rpg: false
      # Sort initial layer facts in RPG by availability order (only use if using tie_breaking_rpg)
      sort_initial_layer: false
      # Disable the tie-breaking in search that favours plans with shorter makespans
      disable_tie_breaking_search: false
      # Full FF helpful actions (rather than just those in the RP applicable in the current state)
      full_ff_helpful: false
      # Rather than building a partial order, build a total-order
      total_order: false

    plan_validator:
      plugin: "omni_plan_val/ValValidator"
      # Tolerance value for validation (float)
      tolerance: 0.0
      # Robustness analysis parameters: n (timestamp tolerance), p (PNE tolerance), m (number of test plans)
      robustness_n: 0.0
      robustness_p: 0.0
      robustness_m: 0
      # Robustness for action timestamps with PNE tolerance p
      robustness_action_p: 0.0
      # Robustness for PNEs with timestamp tolerance n
      robustness_pne_n: 0.0
      # Metric for robustness testing: "m" (maximum), "a" (accumulative), "d" (delay)
      robustness_metric: "m"
      # Distribution for robustness testing: "u" (uniform), "n" (normal), "p" (pseudo-normal)
      robustness_distribution: "u"
      # Vary PNEs for event preconditions
      vary_event_preconditions: false
      # Use graphplan length where no metric specified
      use_graphplan_length: false
      # Check set of derived predicates for stratification
      check_derived_predicates: true
      # Continue executing plan even if an action precondition is unsatisfied
      continue_on_precondition_fail: false
      # Produce error report for the full plan and try to repair it
      produce_error_report: false
      # Warn if invariants with continuous effects cannot be checked
      warn_invariants: false
      # Use makespan as metric for temporal plans
      use_makespan_metric: false

    plan_dispatcher:
      # If true, the dispatcher will cancel the plan if any action aborts.
      # If false, allows already running actions to finish even if an abort has occurred.
      cancel_on_abort: false
      # If true, the dispatcher will cancel the plan if new goals are added
      # to the PDDL manager during execution, which may indicate that the current
      # plan is no longer valid. If false, new goals will be ignored during execution.
      cancel_on_new_goals: false
      # Number of threads to use for parallel execution (default: number of hardware threads)
      execution_threads: -1

    actions_plugins:
      - "omni_plan_demos/MoveYasminFactoryAction"
      - "omni_plan_demos/ChargeAction"
      - "omni_plan_demos/AskChargeAction"
    move_action:
      increment: 0.05
      abort_outcome: aborted
      cancel_outcome: canceled
      succeed_outcome: succeeded
      enable_viewer_pub: true
    charge_action:
      increment: 0.05
    ask_charge_action:
      increment: 0.05
